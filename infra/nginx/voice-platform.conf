# nginx site for servers where nginx already owns ports 80/443 (instead of the Caddy service).
# Install:  see docs/deploy-vps.md, "Server already runs nginx".
# Replace app.example.com and livekit.example.com with your domains; certbot adds HTTPS.

# Dashboard and API (Next.js on 127.0.0.1:3000)
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;
    # Knowledge base document uploads (up to 25 MB each).
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# LiveKit signalling for browser test calls (WebSocket on 127.0.0.1:7880).
# Call audio itself bypasses nginx: UDP 50000-60000, or TCP 7881 as a fallback.
server {
    listen 80;
    listen [::]:80;
    server_name livekit.example.com;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A call's signalling connection stays open for the whole call.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
