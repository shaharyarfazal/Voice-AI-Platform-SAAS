# Single-server stack for a VPS (sized for a 6 vCPU / 12 GB Contabo server).
#
# LiveKit, SIP, Caddy, the agent and the web app use the host network: WebRTC and SIP need real
# UDP ports and the server's public IP, and Docker's port mapping of 20k UDP ports is slow.
# Postgres and Redis are bound to 127.0.0.1 on ports 15432 and 16379, so they do not clash with
# other software on the server (for example n8n's own Postgres or Redis).
#
# Usage:  cd infra && cp .env.example .env && (edit .env) && docker compose up -d --build

# Docker keeps container logs forever by default; cap each service at 3 x 20 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: voice
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice -d voice"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    logging: *logging
    # Voice traffic gets CPU before anything else on the server (dashboard, database, other tools).
    cpu_shares: 4096
    network_mode: host
    depends_on: [redis]
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: ["127.0.0.1"]
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          use_external_ip: true
        redis:
          address: 127.0.0.1:16379
          password: ${REDIS_PASSWORD}
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        logging:
          level: info

  sip:
    image: livekit/sip:latest
    restart: unless-stopped
    logging: *logging
    cpu_shares: 4096
    network_mode: host
    depends_on: [livekit]
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:16379
          password: ${REDIS_PASSWORD}
        sip_port: 5060
        rtp_port: 10000-20000
        health_port: 8091
        use_external_ip: true
        logging:
          level: info

  web:
    build: ../web
    restart: unless-stopped
    logging: *logging
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      HOSTNAME: 127.0.0.1
      # Shared database for every brand (docs/multi-brand.md); defaults to the Postgres below.
      DATABASE_URL: ${WEB_DATABASE_URL:-postgres://voice:${POSTGRES_PASSWORD}@127.0.0.1:15432/voice}
      DATABASE_PREPARE: ${WEB_DATABASE_PREPARE:-true}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      NEXT_PUBLIC_LIVEKIT_URL: wss://${LIVEKIT_DOMAIN}
      # Optional LiveKit Cloud project for browser calls (see agent-cloud below).
      LIVEKIT_WEB_CALLS: ${LIVEKIT_WEB_CALLS:-self-hosted}
      LIVEKIT_CLOUD_URL: ${LIVEKIT_CLOUD_URL:-}
      LIVEKIT_CLOUD_API_KEY: ${LIVEKIT_CLOUD_API_KEY:-}
      LIVEKIT_CLOUD_API_SECRET: ${LIVEKIT_CLOUD_API_SECRET:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      # Used by the admin panel's health checks and live metrics.
      REDIS_URL: redis://default:${REDIS_PASSWORD}@127.0.0.1:16379
      LIVEKIT_HTTP_URL: http://127.0.0.1:7880
      SIP_HEALTH_URL: http://127.0.0.1:8091
      AGENT_HEALTH_URL: http://127.0.0.1:8081
      # Google / Microsoft sign-in and calendar connections (docs/integrations.md).
      APP_URL: https://${APP_DOMAIN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Scheduling engine (the Schedule pages talk to it through the web app).
      SCHEDULER_URL: http://127.0.0.1:8100
      # Credits and payments (Stripe Checkout). Without STRIPE_SECRET_KEY billing stays manual.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      BRAND_ID: ${BRAND_ID:-default}
      BILLING_CATALOG: ${BILLING_CATALOG:-}
      SCHED_JWT_SECRET: ${SCHED_JWT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      # Read-only use: the agent editor lists each provider's current models and voices.
      ELEVEN_API_KEY: ${ELEVEN_API_KEY:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Outbound calls: SIP credentials for dialling out through your carrier (docs/telephony.md).
      TELNYX_SIP_USERNAME: ${TELNYX_SIP_USERNAME:-}
      TELNYX_SIP_PASSWORD: ${TELNYX_SIP_PASSWORD:-}
      TWILIO_SIP_DOMAIN: ${TWILIO_SIP_DOMAIN:-}
      TWILIO_SIP_USERNAME: ${TWILIO_SIP_USERNAME:-}
      TWILIO_SIP_PASSWORD: ${TWILIO_SIP_PASSWORD:-}
      # Selling numbers to workspaces and verifying clients' own numbers (the platform's Twilio account;
      # bought numbers go onto TWILIO_TRUNK_SID). Without them the Numbers page can't buy or verify.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_TRUNK_SID: ${TWILIO_TRUNK_SID:-}
      # Call recordings in S3-compatible storage, shared with a Vercel deployment. Empty: kept on this disk.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # White label: product name shown when no agency branding applies.
      PLATFORM_NAME: ${PLATFORM_NAME:-}
    volumes:
      - recordings:/data/recordings

  # Scheduling engine (scheduler/): availability, race-safe bookings, technicians and job records.
  # Runs its migrations (Postgres schema "sched") on start. Only the web app and the agent call it,
  # on 127.0.0.1:8100; it is not exposed publicly.
  scheduler:
    build: { context: ../scheduler, target: prod }
    restart: unless-stopped
    logging: *logging
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment: &scheduler-env
      HOST: 127.0.0.1
      PORT: 8100
      # A direct connection, not a pooler: the service switches roles at connect time for row-level
      # security, and Supabase's pooler drops that silently.
      DATABASE_URL: ${SCHED_DATABASE_URL:-postgresql+asyncpg://voice:${POSTGRES_PASSWORD}@127.0.0.1:15432/voice}
      DB_POOL_SIZE: ${SCHED_DB_POOL_SIZE:-10}
      # Database 2, apart from anything else using this Redis.
      REDIS_URL: redis://default:${REDIS_PASSWORD}@127.0.0.1:16379/2
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      SCHED_JWT_SECRET: ${SCHED_JWT_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: https://${APP_DOMAIN}
      # Technicians' calendars: the same OAuth apps as sign-in (docs/integrations.md).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
    volumes:
      - scheduler-artifacts:/data/artifacts

  # Background jobs: hold expiry, calendar writes with retries, calendar sync, notification channel
  # renewal, token refresh and reconciliation.
  scheduler-worker:
    build: { context: ../scheduler, target: prod }
    restart: unless-stopped
    logging: *logging
    network_mode: host
    depends_on: [scheduler, redis]
    command: ["arq", "app.worker.settings.WorkerSettings"]
    environment: *scheduler-env

  agent:
    build: ../agent
    restart: unless-stopped
    logging: *logging
    cpu_shares: 4096
    network_mode: host
    depends_on: [livekit, web]
    # Each call runs in its own process; give the worker room to grow.
    stop_grace_period: 2m
    environment: &agent-env
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      WEB_API_URL: http://127.0.0.1:3000
      SCHEDULER_URL: http://127.0.0.1:8100
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      # AI providers: set any you have. Each agent picks one per role; the rest are fallbacks.
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ELEVEN_API_KEY: ${ELEVEN_API_KEY:-}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      TELNYX_SIP_IPS: ${TELNYX_SIP_IPS:-}
      TWILIO_SIP_IPS: ${TWILIO_SIP_IPS:-}
      FALLBACK_LLM_BASE_URL: ${FALLBACK_LLM_BASE_URL:-}
      FALLBACK_LLM_API_KEY: ${FALLBACK_LLM_API_KEY:-}
      FALLBACK_LLM_MODEL: ${FALLBACK_LLM_MODEL:-}
      # Warm agent processes kept ready for the next call. Raise on a server with spare CPU.
      AGENT_IDLE_PROCESSES: ${AGENT_IDLE_PROCESSES:-2}

  # The same agent, connected to LiveKit Cloud instead of the self-hosted server. Runs only when
  # COMPOSE_PROFILES in .env includes "cloud"; Admin > System switches browser calls to it.
  agent-cloud:
    build: ../agent
    profiles: ["cloud"]
    restart: unless-stopped
    logging: *logging
    network_mode: host
    depends_on: [web]
    stop_grace_period: 2m
    environment:
      <<: *agent-env
      LIVEKIT_URL: ${LIVEKIT_CLOUD_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_CLOUD_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_CLOUD_API_SECRET:-}
      # The self-hosted agent already listens on 8081.
      AGENT_HTTP_PORT: 8082

  # HTTPS for both domains. Skipped when COMPOSE_PROFILES in .env doesn't include "caddy",
  # for servers where nginx already owns ports 80/443 (use nginx/voice-platform.conf instead).
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    logging: *logging
    network_mode: host
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:?set LIVEKIT_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  recordings:
  scheduler-artifacts:
