# Single-server stack for a VPS (sized for a 6 vCPU / 12 GB Contabo server).
#
# LiveKit, SIP, Caddy, the agent and the web app use the host network: WebRTC and SIP need real
# UDP ports and the server's public IP, and Docker's port mapping of 20k UDP ports is slow.
# Postgres and Redis are bound to 127.0.0.1 on ports 15432 and 16379, so they do not clash with
# other software on the server (for example n8n's own Postgres or Redis).
#
# Usage:  cd infra && cp .env.example .env && (edit .env) && docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: voice
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice -d voice"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    network_mode: host
    depends_on: [redis]
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: ["127.0.0.1"]
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          use_external_ip: true
        redis:
          address: 127.0.0.1:16379
          password: ${REDIS_PASSWORD}
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        logging:
          level: info

  sip:
    image: livekit/sip:latest
    restart: unless-stopped
    network_mode: host
    depends_on: [livekit]
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:16379
          password: ${REDIS_PASSWORD}
        sip_port: 5060
        rtp_port: 10000-20000
        health_port: 8091
        use_external_ip: true
        logging:
          level: info

  web:
    build: ../web
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      HOSTNAME: 127.0.0.1
      DATABASE_URL: postgres://voice:${POSTGRES_PASSWORD}@127.0.0.1:15432/voice
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      NEXT_PUBLIC_LIVEKIT_URL: wss://${LIVEKIT_DOMAIN}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      # Used by the admin panel's health checks and live metrics.
      REDIS_URL: redis://default:${REDIS_PASSWORD}@127.0.0.1:16379
      LIVEKIT_HTTP_URL: http://127.0.0.1:7880
      SIP_HEALTH_URL: http://127.0.0.1:8091
      AGENT_HEALTH_URL: http://127.0.0.1:8081

  agent:
    build: ../agent
    restart: unless-stopped
    network_mode: host
    depends_on: [livekit, web]
    # Each call runs in its own process; give the worker room to grow.
    stop_grace_period: 2m
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      WEB_API_URL: http://127.0.0.1:3000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:?set DEEPGRAM_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:?set CARTESIA_API_KEY}
      TELNYX_SIP_IPS: ${TELNYX_SIP_IPS:-}
      TWILIO_SIP_IPS: ${TWILIO_SIP_IPS:-}
      FALLBACK_LLM_BASE_URL: ${FALLBACK_LLM_BASE_URL:-}
      FALLBACK_LLM_API_KEY: ${FALLBACK_LLM_API_KEY:-}
      FALLBACK_LLM_MODEL: ${FALLBACK_LLM_MODEL:-}

  # HTTPS for both domains. Skipped when COMPOSE_PROFILES in .env doesn't include "caddy",
  # for servers where nginx already owns ports 80/443 (use nginx/voice-platform.conf instead).
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    network_mode: host
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:?set LIVEKIT_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  postgres-data:
  redis-data:
  caddy-data:
